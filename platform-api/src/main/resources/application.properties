# api.jwt.secret must be supplied per environment (env var API_JWT_SECRET, or a profile file for
# dev/local/test). Deliberately no default here: an unset value fails @Value binding at startup
# instead of silently falling back to a guessable committed secret.
api.rate-limit.requests-per-minute=100

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

platform.ingestion.kafka.topic=work-items.ingest
platform.ingestion.kafka.dlq-topic=work-items.ingest.dlq
platform.ingestion.kafka.consumer-group=platform-ingestion-group
platform.ingestion.default-group=group-ops

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read-only
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

platform.config.maker-checker.enabled=true
