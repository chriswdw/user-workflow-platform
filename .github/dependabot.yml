version: 2
updates:
  # Backend — Gradle Kotlin DSL, versions centralized in gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.kafka:*"
    ignore:
      # 7.41.0's plugin POM depends on rewrite-bom:8.91.0, which was never
      # published to Maven Central (latest is 8.90.4) — build fails to resolve.
      - dependency-name: "org.openrewrite.rewrite"
        versions: ["7.41.0"]

  # Frontend — npm/Vite in platform-frontend/
  - package-ecosystem: "npm"
    directory: "/platform-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
