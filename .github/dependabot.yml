version: 2
updates:
  # Backend — Gradle Kotlin DSL, versions centralized in gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.kafka:*"
      junit:
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
      openrewrite:
        patterns:
          - "org.openrewrite.rewrite"
          - "org.openrewrite.recipe:*"
    ignore:
      # 7.40.0 and 7.41.0's plugin POMs depend on rewrite-bom:8.91.0, which was never
      # published to Maven Central (latest is 8.90.4) — the build fails to resolve it.
      # Revisit when rewrite-bom 8.91.0 (or a later plugin release) is published.
      - dependency-name: "org.openrewrite.rewrite"
        versions: ["7.40.0", "7.41.0"]

  # Frontend — npm/Vite in platform-frontend/
  - package-ecosystem: "npm"
    directory: "/platform-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      ag-grid:
        patterns:
          - "ag-grid-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "ts-jest"
          - "@types/jest"
