name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Intentionally excluded from this workflow:
#   - OWASP dependency-check: needs an NVD_API_KEY secret to avoid NVD rate-limiting; without
#     one it's slow and flaky, so it's left out of the required PR check for now.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test (unit, Cucumber, coverage verification, Spotless check)
        run: ./gradlew build cucumber --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: platform-frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run test:bdd

  sonar:
    # SonarCloud analysis with backend (JaCoCo) and frontend (lcov) coverage. Needs the SONAR_TOKEN
    # repository secret, which GitHub does not expose to fork PRs or to Dependabot-triggered runs,
    # so those are skipped rather than failed.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: Sonar needs blame data and the PR/branch merge base

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: platform-frontend/package-lock.json

      - name: Backend build, tests and JaCoCo reports
        run: ./gradlew build cucumber --no-daemon

      - name: Frontend tests and lcov coverage
        working-directory: platform-frontend
        run: |
          npm ci
          npm run test:coverage

      - name: SonarCloud analysis (waits for the quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon -Dsonar.token="$SONAR_TOKEN" -Dsonar.qualitygate.wait=true

  frontend-e2e:
    runs-on: ubuntu-latest
    # Pinned to the @playwright/test version in package-lock.json so the browser build
    # matches the one checked-in visual snapshots were generated against — a
    # mismatched Chromium build here is what causes snapshot-diff flakes. This tag MUST be
    # bumped together with @playwright/test: a PR run installs the merge result's lockfile, and a
    # mismatch fails with "Executable doesn't exist at /ms-playwright/chromium_headless_shell-*".
    container: mcr.microsoft.com/playwright:v1.64.1-jammy
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: platform-frontend/package-lock.json

      - run: npm ci
      - run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform-frontend/playwright-report/
          retention-days: 14
