name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Intentionally excluded from this workflow:
#   - Sonar: sonar.host.url is http://localhost:9000, unreachable from a GitHub-hosted runner.
#     Needs SonarCloud or a public self-hosted server + SONAR_TOKEN secret to wire in.
#   - OWASP dependency-check: needs an NVD_API_KEY secret to avoid NVD rate-limiting; without
#     one it's slow and flaky, so it's left out of the required PR check for now.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test (unit, Cucumber, coverage verification, Spotless check)
        run: ./gradlew build cucumber --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: platform-frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run test:bdd

  frontend-e2e:
    runs-on: ubuntu-latest
    # Pinned to the @playwright/test version in package.json so the browser build
    # matches the one checked-in visual snapshots were generated against — a
    # mismatched Chromium build here is what causes snapshot-diff flakes.
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    defaults:
      run:
        working-directory: platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: platform-frontend/package-lock.json

      - run: npm ci
      - run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform-frontend/playwright-report/
          retention-days: 14
